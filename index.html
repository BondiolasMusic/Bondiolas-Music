<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Bondiolas Music | Dynamic Style</title>

    <!-- Conexiones anticipadas para que carguen más rápido datos, portadas y audio -->
    <link rel="preconnect" href="https://docs.google.com" crossorigin>
    <link rel="preconnect" href="https://drive.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">

    <style>
        :root {
            --primary: #004D09;
            --primary-light: #007a0e;
            --fondo: #0a0a0a;
            --tarjeta: rgba(255, 255, 255, 0.06);
            --texto: #ffffff;
            --texto-sec: #aaaaaa;
            /* Variable dinámica para la imagen del circulito */
            --thumb-url: url('image_7.png');
            /* Curva de animación común (suave y con un poco de "rebote" al final) */
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --progress: 0%;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--fondo);
            color: var(--texto);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding-bottom: 140px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body.no-scroll { overflow: hidden; }

        #bg-album-blur {
            position: fixed;
            inset: -60px; /* se agranda un poco para que el blur no deje bordes oscuros */
            z-index: -1;
            opacity: 0.35;
            filter: blur(40px);
            transition: opacity 0.5s ease;
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }
        #bg-album-blur.fading { opacity: 0; }

        /* ---------- ANIMACIONES BASE ---------- */
        @keyframes fadeUp {
            from { opacity: 0; translate: 0 24px; }
            to   { opacity: 1; translate: 0 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shimmer { to { background-position: -200% 0; } }
        @keyframes pop {
            0%   { transform: scale(0.85); opacity: 0.4; }
            60%  { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes eq {
            0%, 100% { height: 3px; }
            50%      { height: 14px; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes playerIn {
            from { opacity: 0; translate: -50% 40px; }
            to   { opacity: 1; translate: -50% 0; }
        }

        header {
            padding: 50px 40px 20px;
            background: linear-gradient(to bottom, rgba(0,77,9,0.3), transparent);
            animation: fadeIn 0.8s ease both;
        }

        .header-title { display: flex; align-items: baseline; gap: 15px; flex-wrap: wrap; }
        h1 { font-size: 2.8rem; letter-spacing: -1px; margin: 0; font-weight: 800; animation: fadeUp 0.7s var(--ease) both; }
        .subtitle { font-size: 1rem; opacity: 0.7; font-weight: 400; animation: fadeUp 0.7s 0.1s var(--ease) both; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            padding: 20px 40px;
        }

        .card {
            background: var(--tarjeta);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.35s var(--ease), background 0.3s ease, border-color 0.3s ease, box-shadow 0.35s ease;
            border: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            animation: fadeUp 0.55s var(--ease) both;
            animation-delay: calc(var(--i, 0) * 45ms);
            outline: none;
        }

        .card:hover, .card:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-8px);
            border-color: var(--primary-light);
            box-shadow: 0 14px 30px rgba(0,0,0,0.45);
        }
        .card:active { transform: translateY(-4px) scale(0.98); }

        /* Portada con zoom suave y botón de play al pasar el mouse */
        .card-cover { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: rgba(255,255,255,0.04); }
        .card img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 0.5s var(--ease), opacity 0.4s ease; }
        .card:hover img { transform: scale(1.06); }

        .card-play {
            position: absolute; right: 10px; bottom: 10px;
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.35s var(--ease);
        }
        .card-play svg { margin-left: 2px; }
        .card:hover .card-play, .card:focus-visible .card-play { opacity: 1; transform: translateY(0); }

        .card-tit { margin-top: 15px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-art { color: var(--texto-sec); font-size: 0.85rem; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Tarjetas "fantasma" mientras cargan los datos */
        .card.skeleton { pointer-events: none; }
        .sk {
            border-radius: 8px;
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s linear infinite;
        }
        .sk-img { aspect-ratio: 1; }
        .sk-line { height: 14px; margin-top: 15px; width: 80%; }
        .sk-line.short { height: 11px; margin-top: 8px; width: 50%; }

        .estado-msg { grid-column: 1 / -1; text-align: center; color: var(--texto-sec); padding: 40px 0; animation: fadeIn 0.4s ease both; }

        /* Fade-in de imágenes cuando terminan de cargar */
        .fade-img { opacity: 0; }
        .fade-img.loaded { opacity: 1; }

        /* ---------- VISTA ÁLBUM ---------- */
        #vista-album {
            display: block; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 100;
            overflow-y: auto; padding: 60px 40px 160px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.35s ease, visibility 0.35s;
            overscroll-behavior: contain;
        }
        #vista-album.open { opacity: 1; visibility: visible; pointer-events: auto; }

        #vista-album .btn-back,
        #vista-album .alb-head { opacity: 0; translate: 0 20px; transition: opacity 0.45s ease, translate 0.5s var(--ease); }
        #vista-album.open .btn-back { opacity: 1; translate: 0 0; transition-delay: 0.05s; }
        #vista-album.open .alb-head { opacity: 1; translate: 0 0; transition-delay: 0.12s; }

        .btn-back {
            background: var(--primary);
            border: none; color: #fff; padding: 12px 28px;
            border-radius: 50px; cursor: pointer; font-weight: 700;
            margin-bottom: 30px; transition: background 0.3s, transform 0.25s var(--ease), box-shadow 0.3s;
        }
        .btn-back:hover { background: var(--primary-light); transform: translateX(-4px); box-shadow: 0 6px 16px rgba(0,77,9,0.5); }
        .btn-back:active { transform: scale(0.96); }

        .alb-head { display: flex; gap: 40px; align-items: flex-end; margin-bottom: 40px; flex-wrap: wrap; }
        #alb-img { width: 240px; height: 240px; border-radius: 15px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: opacity 0.4s ease; background: rgba(255,255,255,0.04); }
        .alb-label { text-transform: uppercase; font-size: 0.75rem; font-weight: 900; color: var(--primary-light); }
        #alb-tit { font-size: 3.5rem; margin: 5px 0 15px 0; line-height: 1.05; }
        #alb-art { font-size: 1.3rem; margin: 0; }

        #lista-canciones { max-width: 850px; margin-top: 20px; }

        .song-item {
            display: flex; align-items: center; padding: 14px; border-radius: 10px; cursor: pointer;
            transition: background 0.2s ease, transform 0.25s var(--ease);
            animation: fadeUp 0.45s var(--ease) both;
            animation-delay: calc(0.15s + var(--i, 0) * 35ms);
        }
        .song-item:hover { background: rgba(255,255,255,0.08); transform: translateX(4px); }
        .song-item:active { transform: scale(0.99); }
        .song-num { width: 40px; opacity: 0.4; display: flex; align-items: center; }
        .song-item.active .song-num { opacity: 1; }
        .song-item.active b { color: var(--primary-light); }

        /* Ecualizador animado en la canción que está sonando */
        .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
        .eq span { width: 3px; height: 3px; border-radius: 1px; background: var(--primary-light); animation: eq 0.9s ease-in-out infinite; }
        .eq span:nth-child(2) { animation-delay: -0.3s; }
        .eq span:nth-child(3) { animation-delay: -0.6s; }
        .song-item.active .num-txt { display: none; }
        .song-item.active .eq { display: flex; }
        body.is-paused .eq span { animation-play-state: paused; }

        /* ---------- REPRODUCTOR ---------- */
        .player {
            position: fixed; bottom: 25px; left: 50%;
            translate: -50% 0;
            width: 92%; max-width: 900px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex; flex-direction: column; gap: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 1000;
            box-sizing: border-box;
            animation: playerIn 0.7s 0.2s var(--ease) both;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        body:not(.is-paused) .player { border-color: rgba(0,122,14,0.35); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,77,9,0.25); }

        .p-main-content { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .p-info { display: flex; align-items: center; width: 35%; min-width: 0; }
        .p-info img { width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.05); }
        .p-info img.pop { animation: pop 0.5s var(--ease); }
        .p-text { overflow: hidden; min-width: 0; }
        #p-tit { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
        #p-art { color: var(--texto-sec); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-text.pop { animation: fadeUp 0.4s var(--ease); }

        .p-controls { display: flex; align-items: center; gap: 15px; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; transition: color 0.2s, transform 0.2s var(--ease); display: flex; align-items: center; }
        .control-btn:hover { color: var(--primary-light); transform: scale(1.1); }
        .control-btn:active { transform: scale(0.92); }
        .control-btn.active { color: var(--primary-light); filter: drop-shadow(0 0 6px var(--primary-light)); }

        /* CAMBIO: CENTRADO DE ICONOS */
        .play-main {
            position: relative;
            background: linear-gradient(45deg, var(--primary), var(--primary-light));
            color: white; width: 45px; height: 45px; border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 77, 9, 0.5); border: 2px solid rgba(255,255,255,0.2);
            display: flex !important;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.2s var(--ease), box-shadow 0.3s ease;
        }
        .play-main:hover { color: white; box-shadow: 0 6px 18px rgba(0, 122, 14, 0.6); }

        .p-icon-play, .p-icon-pause { display: none; }
        /* Ajuste visual para que el triángulo del play se vea centrado al ojo */
        .p-icon-play { margin-left: 3px; }

        .playing .p-icon-pause { display: block; animation: pop 0.3s var(--ease); }
        .paused .p-icon-play { display: block; animation: pop 0.3s var(--ease); }

        /* Aro girando mientras el audio carga (buffering) */
        .play-main::after {
            content: ''; position: absolute; inset: -5px; border-radius: 50%;
            border: 2px solid transparent; border-top-color: var(--primary-light);
            opacity: 0; transition: opacity 0.2s;
        }
        .play-main.loading::after { opacity: 1; animation: spin 0.8s linear infinite; }

        .p-progress-container { display: flex; align-items: center; gap: 10px; width: 100%; }
        .time-display { font-size: 0.75rem; color: var(--texto-sec); width: 35px; text-align: center; font-variant-numeric: tabular-nums; }
        .p-progress-bar-wrapper { flex: 1; display: flex; align-items: center; position: relative; }

        input[type="range"]#p-progress-bar {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 0;
            background: linear-gradient(to right, var(--primary-light) var(--progress), rgba(255, 255, 255, 0.1) var(--progress));
            border-radius: 5px; outline: none; cursor: pointer;
            transition: height 0.2s ease;
        }
        .p-progress-bar-wrapper:hover input[type="range"]#p-progress-bar { height: 8px; }

        /* --- CIRCULITO PERSONALIZABLE --- */
        input[type="range"]#p-progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--thumb-url) no-repeat center center; /* USANDO VARIABLE */
            background-size: cover;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: transform 0.2s var(--ease), box-shadow 0.2s ease;
        }
        input[type="range"]#p-progress-bar:hover::-webkit-slider-thumb { transform: scale(1.12); box-shadow: 0 0 12px rgba(0,122,14,0.7); }
        input[type="range"]#p-progress-bar:active::-webkit-slider-thumb { transform: scale(0.95); }

        input[type="range"]#p-progress-bar::-moz-range-thumb {
            width: 28px; height: 28px;
            background: var(--thumb-url) no-repeat center center;
            background-size: cover;
            border-radius: 50%;
            border: 2px solid white;
            box-sizing: border-box;
            transition: transform 0.2s var(--ease);
        }
        input[type="range"]#p-progress-bar:hover::-moz-range-thumb { transform: scale(1.12); }

        audio { display: none; }

        /* ---------- RESPONSIVE (celular) ---------- */
        @media (max-width: 640px) {
            header { padding: 36px 20px 14px; }
            h1 { font-size: 2.1rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 16px 20px; }
            .card { padding: 12px; }
            .card-play { width: 36px; height: 36px; opacity: 1; transform: none; }
            #vista-album { padding: 30px 20px 170px; }
            .alb-head { gap: 20px; }
            #alb-img { width: 180px; height: 180px; }
            #alb-tit { font-size: 2.2rem; }
            .player { padding: 12px 18px; bottom: 12px; width: 94%; }
            .p-info { width: auto; flex: 1; }
            .p-spacer { display: none; }
        }

        /* Respeta a quien tiene las animaciones desactivadas en el sistema */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body class="is-paused">

    <div id="bg-album-blur"></div>

    <div id="main-view">
        <header>
            <div class="header-title">
                <h1>Bondiolas Music</h1>
                <span class="subtitle">Bienvenido a la biblioteca de Bondiolas</span>
            </div>
        </header>
        <div class="grid" id="grid-albumes"></div>
    </div>

    <div id="vista-album" aria-hidden="true">
        <button class="btn-back" onclick="cerrarAlbum()">← Volver</button>
        <div class="alb-head">
            <img id="alb-img" class="fade-img" alt="">
            <div>
                <span class="alb-label">Álbum</span>
                <h2 id="alb-tit"></h2>
                <p id="alb-art"></p>
            </div>
        </div>
        <div id="lista-canciones"></div>
    </div>

    <div class="player">
        <div class="p-main-content">
            <div class="p-info">
                <img id="p-img" alt="">
                <div class="p-text" id="p-text">
                    <div id="p-tit">Selecciona una canción</div>
                    <div id="p-art">Bondiolas Music</div>
                </div>
            </div>

            <div class="p-controls">
                <button class="control-btn" id="btn-loop" onclick="toggleLoop()" title="Repetir">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
                <button class="control-btn play-main paused" id="btn-play" onclick="togglePlay()" title="Reproducir / Pausar">
                    <svg class="p-icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="p-icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
            <div class="p-spacer" style="width:30%;"></div>
        </div>

        <div class="p-progress-container">
            <span id="current-time" class="time-display">0:00</span>
            <div class="p-progress-bar-wrapper">
                <input type="range" id="p-progress-bar" min="0" max="0" step="0.01" value="0">
            </div>
            <span id="total-duration" class="time-display">0:00</span>
        </div>
        <audio id="main-audio" preload="metadata"></audio>
    </div>

    <script>
        const URL_ALB = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSeiWFIXNf9Xvg2kBMH9VUoQzZzpAAVmcXg2T6PtO-gip5nj0sx2QlTF2LKNHerqqvM2TJZnjLfeGz/pub?gid=0&single=true&output=tsv";
        const URL_CAN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSeiWFIXNf9Xvg2kBMH9VUoQzZzpAAVmcXg2T6PtO-gip5nj0sx2QlTF2LKNHerqqvM2TJZnjLfeGz/pub?gid=92592278&single=true&output=tsv";

        // --- AQUÍ PEGA EL ENLACE DE LA PESTAÑA "CONFIG" ---
        const URL_CFG = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSeiWFIXNf9Xvg2kBMH9VUoQzZzpAAVmcXg2T6PtO-gip5nj0sx2QlTF2LKNHerqqvM2TJZnjLfeGz/pub?gid=1912040231&single=true&output=tsv";

        // Imagen de reemplazo (antes usaba via.placeholder.com, que ya no funciona)
        const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1a1a1a"/>' +
            '<path d="M42 30v32a9 9 0 1 0 5 8V42h18V30z" fill="#007a0e"/></svg>'
        );

        let albumes = [], canciones = [];
        let albumActual = null;      // { alb, cans } del álbum abierto
        let urlSonando = '';         // para marcar la canción activa
        let arrastrando = false;     // true mientras el usuario mueve la barra
        let rafId = 0;

        // Cacheamos los elementos una sola vez (más rápido que buscarlos cada vez)
        const $ = id => document.getElementById(id);
        const audio = $('main-audio');
        const progressBar = $('p-progress-bar');
        const btnPlay = $('btn-play');
        const grid = $('grid-albumes');
        const vista = $('vista-album');
        const lista = $('lista-canciones');
        const bg = $('bg-album-blur');
        const pImg = $('p-img');
        const tActual = $('current-time');
        const tTotal = $('total-duration');

        // Escapa texto para meterlo en HTML sin romper nada (comillas, <, &...)
        const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));

        function limpiar(url, esAudio = false) {
            if (!url) return "";
            url = url.trim();
            if (url.includes('github') || url.includes('raw')) return url;
            const match = url.match(/(?:id=|\/d\/)([\w-]+)/);
            const id = match ? match[1] : url;
            return esAudio ? `https://docs.google.com/uc?export=media&id=${id}` : `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
        }

        // Cambia una imagen con fade-in, sin recargar si ya es la misma
        function setImg(el, src) {
            src = src || PLACEHOLDER;
            if (el.getAttribute('src') === src) return;
            el.classList.remove('loaded');
            el.src = src;
        }

        // Un solo listener para todas las imágenes: fade-in al cargar y reemplazo si fallan
        document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('loaded'); }, true);
        document.addEventListener('error', e => {
            const img = e.target;
            if (img.tagName === 'IMG' && img.getAttribute('src') !== PLACEHOLDER) img.src = PLACEHOLDER;
        }, true);

        const leerTSV = txt => txt.split(/\r?\n/).slice(1).filter(l => l.trim()).map(l => l.split('\t'));

        function mostrarSkeletons(n = 8) {
            grid.innerHTML = Array.from({ length: n }, (_, i) =>
                `<div class="card skeleton" style="--i:${i}"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>`
            ).join('');
        }

        async function init() {
            setImg(pImg, PLACEHOLDER);
            mostrarSkeletons();
            try {
                const [resA, resC, resConfig] = await Promise.all([
                    fetch(URL_ALB),
                    fetch(URL_CAN),
                    URL_CFG.startsWith('http') ? fetch(URL_CFG).catch(() => null) : Promise.resolve(null)
                ]);

                albumes = leerTSV(await resA.text());
                canciones = leerTSV(await resC.text());

                // Cargar imagen del circulito desde Excel
                if (resConfig && resConfig.ok) {
                    const configData = leerTSV(await resConfig.text());
                    if (configData[0] && configData[0][0]) {
                        const thumbUrlFinal = limpiar(configData[0][0]);
                        document.documentElement.style.setProperty('--thumb-url', `url('${thumbUrlFinal}')`);
                    }
                }

                if (!albumes.length) { grid.innerHTML = '<div class="estado-msg">Todavía no hay álbumes cargados.</div>'; return; }

                // Se arma todo el HTML de una y se inserta una sola vez (mucho más rápido que innerHTML += en un bucle)
                grid.innerHTML = albumes.map((a, i) => `
                    <div class="card" tabindex="0" data-id="${esc(a[0].trim())}" style="--i:${Math.min(i, 16)}">
                        <div class="card-cover">
                            <img class="fade-img" src="${esc(limpiar(a[3]) || PLACEHOLDER)}" alt="" loading="lazy" decoding="async">
                            <div class="card-play"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
                        </div>
                        <div class="card-tit">${esc(a[1])}</div>
                        <div class="card-art">${esc(a[2])}</div>
                    </div>`).join('');
            } catch (e) {
                console.error("Error cargando datos", e);
                grid.innerHTML = '<div class="estado-msg">No se pudo cargar la biblioteca. Revisá tu conexión y recargá la página.</div>';
            }
        }

        // Click en tarjetas (un solo listener para todas)
        grid.addEventListener('click', e => {
            const card = e.target.closest('.card[data-id]');
            if (card) verAlbum(card.dataset.id);
        });
        grid.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const card = e.target.closest('.card[data-id]');
            if (card) verAlbum(card.dataset.id);
        });

        // Fondo difuminado con transición suave (precarga la imagen antes de cambiarla)
        let bgActual = '';
        function cambiarFondo(src) {
            if (!src || src === bgActual) return;
            bgActual = src;
            const pre = new Image();
            pre.onload = () => {
                if (bgActual !== src) return;
                bg.classList.add('fading');
                setTimeout(() => {
                    if (bgActual !== src) return;
                    bg.style.backgroundImage = `url("${src}")`;
                    bg.classList.remove('fading');
                }, 450);
            };
            pre.src = src;
        }

        function reanimar(el, clase) {
            el.classList.remove(clase);
            void el.offsetWidth; // fuerza a que la animación se repita
            el.classList.add(clase);
        }

        function sonar(t, art, url, img) {
            $('p-tit').innerText = t;
            $('p-art').innerText = art;
            reanimar($('p-text'), 'pop');
            const imgF = limpiar(img);
            setImg(pImg, imgF);
            reanimar(pImg, 'pop');
            cambiarFondo(imgF);

            const src = limpiar(url, true);
            urlSonando = url;
            marcarActiva();
            if (audio.src !== src) {
                audio.src = src;
                progressBar.value = 0;
                progressBar.style.setProperty('--progress', '0%');
                tActual.innerText = '0:00';
            } else {
                audio.currentTime = 0;
            }
            audio.play().catch(() => {});

            // Controles del celular / pantalla de bloqueo
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: t, artist: art, album: albumActual ? albumActual.alb[1] : 'Bondiolas Music',
                    artwork: imgF ? [{ src: imgF, sizes: '512x512' }] : []
                });
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) audio.play().catch(() => {});
            else audio.pause();
        }

        function toggleLoop() { audio.loop = !audio.loop; $('btn-loop').classList.toggle('active', audio.loop); }

        // El estado del botón sigue al audio real (no se desincroniza nunca)
        function setEstado(sonando) {
            btnPlay.classList.toggle('playing', sonando);
            btnPlay.classList.toggle('paused', !sonando);
            document.body.classList.toggle('is-paused', !sonando);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = sonando ? 'playing' : 'paused';
            cancelAnimationFrame(rafId);
            if (sonando) rafId = requestAnimationFrame(loopProgreso);
        }
        audio.addEventListener('play', () => setEstado(true));
        audio.addEventListener('pause', () => setEstado(false));
        audio.addEventListener('ended', () => setEstado(false));
        audio.addEventListener('waiting', () => btnPlay.classList.add('loading'));
        audio.addEventListener('loadstart', () => btnPlay.classList.add('loading'));
        ['playing', 'canplay', 'pause', 'error'].forEach(ev => audio.addEventListener(ev, () => btnPlay.classList.remove('loading')));

        // Barra de progreso fluida a 60fps (timeupdate solo se dispara ~4 veces por segundo)
        let ultimoSeg = -1;
        function pintarProgreso(t) {
            const d = audio.duration;
            if (!d || isNaN(d)) return;
            progressBar.value = t;
            progressBar.style.setProperty('--progress', (t / d) * 100 + '%');
            const s = Math.floor(t);
            if (s !== ultimoSeg) { ultimoSeg = s; tActual.innerText = formatTime(t); }
        }
        function loopProgreso() {
            if (!arrastrando) pintarProgreso(audio.currentTime);
            if (!audio.paused) rafId = requestAnimationFrame(loopProgreso);
        }
        audio.addEventListener('timeupdate', () => { if (audio.paused && !arrastrando) pintarProgreso(audio.currentTime); });

        audio.onloadedmetadata = () => { progressBar.max = audio.duration; tTotal.innerText = formatTime(audio.duration); ultimoSeg = -1; };

        // Mientras arrastrás solo se mueve la barra; el salto real se hace al soltar (evita cortes con Drive)
        progressBar.addEventListener('input', () => {
            arrastrando = true;
            const d = audio.duration || 0;
            const v = +progressBar.value;
            progressBar.style.setProperty('--progress', d ? (v / d) * 100 + '%' : '0%');
            tActual.innerText = formatTime(v);
        });
        progressBar.addEventListener('change', () => {
            if (audio.duration) audio.currentTime = +progressBar.value;
            arrastrando = false;
        });

        function formatTime(s) { if (!isFinite(s)) return '0:00'; const m = Math.floor(s/60); const ss = Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; }

        window.addEventListener('keydown', (e) => {
            if (e.code === "Space" && !e.repeat) { e.preventDefault(); togglePlay(); }
            if (e.key === "Escape" && vista.classList.contains('open')) cerrarAlbum();
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            try { navigator.mediaSession.setActionHandler('seekto', d => { audio.currentTime = d.seekTime; }); } catch (_) {}
        }

        function marcarActiva() {
            lista.querySelectorAll('.song-item').forEach(el => {
                el.classList.toggle('active', !!albumActual && albumActual.cans[+el.dataset.i]?.[2] === urlSonando);
            });
        }

        function verAlbum(id) {
            const alb = albumes.find(a => a[0].trim() == id.trim());
            if (!alb) return;
            const cans = canciones.filter(c => c[0].trim() == id.trim());
            albumActual = { alb, cans };

            setImg($('alb-img'), limpiar(alb[3]));
            $('alb-tit').innerText = alb[1];
            $('alb-art').innerText = alb[2];

            lista.innerHTML = cans.length
                ? cans.map((c, i) => `
                    <div class="song-item${c[2] === urlSonando ? ' active' : ''}" data-i="${i}" style="--i:${Math.min(i, 20)}">
                        <div class="song-num"><span class="num-txt">${i+1}</span><span class="eq"><span></span><span></span><span></span></span></div>
                        <div style="flex:1; min-width:0;"><b>${esc(c[1])}</b><br><small>${esc(alb[2])}</small></div>
                    </div>`).join('')
                : '<div class="estado-msg">Este álbum todavía no tiene canciones.</div>';

            vista.scrollTop = 0;
            vista.classList.add('open');
            vista.setAttribute('aria-hidden', 'false');
            document.body.classList.add('no-scroll');
        }

        lista.addEventListener('click', e => {
            const item = e.target.closest('.song-item');
            if (!item || !albumActual) return;
            const c = albumActual.cans[+item.dataset.i];
            const { alb } = albumActual;
            if (c[2] === urlSonando && audio.src) { togglePlay(); return; } // tocar la que ya suena = pausa/play
            sonar(c[1], alb[2], c[2], alb[3]);
        });

        function cerrarAlbum() {
            vista.classList.remove('open');
            vista.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('no-scroll');
        }

        init();
    </script>
</body>
</html>
