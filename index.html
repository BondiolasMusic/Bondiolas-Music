<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Bondiolas Music | Dynamic Style</title>

    <!-- Conexiones anticipadas para que carguen más rápido datos, portadas y audio -->
    <link rel="preconnect" href="https://docs.google.com" crossorigin>
    <link rel="preconnect" href="https://drive.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
    <link rel="preconnect" href="https://w.soundcloud.com">

    <style>
        :root {
            --primary: #004D09;
            --primary-light: #007a0e;
            --fondo: #0a0a0a;
            --tarjeta: rgba(255, 255, 255, 0.06);
            --texto: #ffffff;
            --texto-sec: #aaaaaa;
            /* Variable dinámica para la imagen del circulito */
            --thumb-url: url('image_7.png');
            /* Curva de animación común (suave y con un poco de "rebote" al final) */
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --progress: 0%;
            --play: #289F64;          /* color del botón de play */
            --panel-w: 360px;         /* ancho del panel derecho */
            --player-h: 100px;        /* alto del reproductor (se ajusta solo) */
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--fondo);
            color: var(--texto);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding-bottom: 130px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body.no-scroll { overflow: hidden; }

        #bg-album-blur {
            position: fixed;
            inset: -60px; /* se agranda un poco para que el blur no deje bordes oscuros */
            z-index: -1;
            opacity: 0.35;
            filter: blur(40px);
            transition: opacity 0.5s ease;
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }
        #bg-album-blur.fading { opacity: 0; }

        /* ---------- ANIMACIONES BASE ---------- */
        @keyframes fadeUp {
            from { opacity: 0; translate: 0 24px; }
            to   { opacity: 1; translate: 0 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shimmer { to { background-position: -200% 0; } }
        @keyframes pop {
            0%   { transform: scale(0.85); opacity: 0.4; }
            60%  { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes eq {
            0%, 100% { height: 3px; }
            50%      { height: 14px; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes playerIn {
            from { opacity: 0; translate: 0 100%; }
            to   { opacity: 1; translate: 0 0; }
        }

        header {
            padding: 50px 40px 20px;
            background: linear-gradient(to bottom, rgba(0,77,9,0.3), transparent);
            animation: fadeIn 0.8s ease both;
        }

        .header-title { display: flex; align-items: baseline; gap: 15px; flex-wrap: wrap; }
        h1 { font-size: 2.8rem; letter-spacing: -1px; margin: 0; font-weight: 800; animation: fadeUp 0.7s var(--ease) both; }
        .subtitle { font-size: 1rem; opacity: 0.7; font-weight: 400; animation: fadeUp 0.7s 0.1s var(--ease) both; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            padding: 20px 40px;
        }

        .card {
            background: var(--tarjeta);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.35s var(--ease), background 0.3s ease, border-color 0.3s ease, box-shadow 0.35s ease;
            border: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            animation: fadeUp 0.55s var(--ease) both;
            animation-delay: calc(var(--i, 0) * 45ms);
            outline: none;
        }

        .card:hover, .card:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-8px);
            border-color: var(--primary-light);
            box-shadow: 0 14px 30px rgba(0,0,0,0.45);
        }
        .card:active { transform: translateY(-4px) scale(0.98); }

        /* Portada con zoom suave y botón de play al pasar el mouse */
        .card-cover { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: rgba(255,255,255,0.04); }
        .card img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 0.5s var(--ease), opacity 0.4s ease; }
        .card:hover img { transform: scale(1.06); }

        .card-play {
            position: absolute; right: 10px; bottom: 10px;
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.35s var(--ease);
        }
        .card-play svg { margin-left: 2px; }
        .card:hover .card-play, .card:focus-visible .card-play { opacity: 1; transform: translateY(0); }

        .card-tit { margin-top: 15px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-art { color: var(--texto-sec); font-size: 0.85rem; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Tarjetas "fantasma" mientras cargan los datos */
        .card.skeleton { pointer-events: none; }
        .sk {
            border-radius: 8px;
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s linear infinite;
        }
        .sk-img { aspect-ratio: 1; }
        .sk-line { height: 14px; margin-top: 15px; width: 80%; }
        .sk-line.short { height: 11px; margin-top: 8px; width: 50%; }

        .estado-msg { grid-column: 1 / -1; text-align: center; color: var(--texto-sec); padding: 40px 0; animation: fadeIn 0.4s ease both; }

        /* Fade-in de imágenes cuando terminan de cargar */
        .fade-img { opacity: 0; }
        .fade-img.loaded { opacity: 1; }

        /* ---------- VISTA ÁLBUM ---------- */
        .vista {
            display: block; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 100;
            overflow-y: auto; padding: 60px 40px 160px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.35s ease, visibility 0.35s;
            overscroll-behavior: contain;
        }
        .vista.open { opacity: 1; visibility: visible; pointer-events: auto; }
        #vista-artista { z-index: 100; }
        #vista-album { z-index: 110; }   /* un álbum abierto desde un perfil queda encima */

        .vista .btn-back,
        .vista .alb-head { opacity: 0; translate: 0 20px; transition: opacity 0.45s ease, translate 0.5s var(--ease); }
        .vista.open .btn-back { opacity: 1; translate: 0 0; transition-delay: 0.05s; }
        .vista.open .alb-head { opacity: 1; translate: 0 0; transition-delay: 0.12s; }

        .btn-back {
            background: var(--primary);
            border: none; color: #fff; padding: 12px 28px;
            border-radius: 50px; cursor: pointer; font-weight: 700;
            margin-bottom: 30px; transition: background 0.3s, transform 0.25s var(--ease), box-shadow 0.3s;
        }
        .btn-back:hover { background: var(--primary-light); transform: translateX(-4px); box-shadow: 0 6px 16px rgba(0,77,9,0.5); }
        .btn-back:active { transform: scale(0.96); }

        .alb-head { display: flex; gap: 40px; align-items: flex-end; margin-bottom: 40px; flex-wrap: wrap; }
        #alb-img { width: 240px; height: 240px; border-radius: 15px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: opacity 0.4s ease; background: rgba(255,255,255,0.04); }
        .alb-label { text-transform: uppercase; font-size: 0.75rem; font-weight: 900; color: var(--primary-light); }
        #alb-tit { font-size: 3.5rem; margin: 5px 0 15px 0; line-height: 1.05; }
        #alb-art { font-size: 1.3rem; margin: 0; }

        #lista-canciones { max-width: 850px; margin-top: 20px; }

        /* ---------- NOMBRES DE ARTISTA CLICKEABLES ---------- */
        .art-link { cursor: pointer; color: inherit; transition: color 0.2s; }
        .art-link:hover { color: var(--texto); text-decoration: underline; text-underline-offset: 2px; }

        /* ---------- PERFIL DE ARTISTA ---------- */
        #art-img {
            width: 220px; height: 220px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 3px solid rgba(0,122,14,0.5);
            background: rgba(255,255,255,0.04); transition: opacity 0.4s ease;
        }
        #art-nom { font-size: 3.5rem; margin: 5px 0 15px 0; line-height: 1.05; }
        #art-stats { font-size: 1rem; margin: 0; color: var(--texto-sec); }
        .sec-tit { font-size: 1.5rem; margin: 10px 0 20px; animation: fadeUp 0.5s 0.15s var(--ease) both; }
        #art-albumes { padding: 0 0 20px; }

        .song-item {
            display: flex; align-items: center; padding: 14px; border-radius: 10px; cursor: pointer;
            transition: background 0.2s ease, transform 0.25s var(--ease);
            animation: fadeUp 0.45s var(--ease) both;
            animation-delay: calc(0.15s + var(--i, 0) * 35ms);
        }
        .song-item:hover { background: rgba(255,255,255,0.08); transform: translateX(4px); }
        .song-item:active { transform: scale(0.99); }
        .song-num { width: 40px; opacity: 0.4; display: flex; align-items: center; }
        .song-item.active .song-num { opacity: 1; }
        .song-item.active b { color: var(--primary-light); }

        /* Canciones sin link: atenuadas y con el símbolo rojo de "no disponible" */
        .song-item.no-disp { cursor: not-allowed; }
        .song-item.no-disp b, .song-item.no-disp small, .song-item.no-disp .song-num { opacity: 0.45; }
        .song-item.no-disp:hover { background: rgba(255,60,60,0.06); transform: none; }
        .icon-no-disp { color: #e53935; flex-shrink: 0; margin-left: 12px; filter: drop-shadow(0 0 4px rgba(229,57,53,0.4)); }
        @keyframes shake { 0%,100% { translate: 0 0; } 20%,60% { translate: -6px 0; } 40%,80% { translate: 6px 0; } }
        .song-item.shake { animation: shake 0.35s ease; }

        /* Ecualizador animado en la canción que está sonando */
        .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
        .eq span { width: 3px; height: 3px; border-radius: 1px; background: var(--primary-light); animation: eq 0.9s ease-in-out infinite; }
        .eq span:nth-child(2) { animation-delay: -0.3s; }
        .eq span:nth-child(3) { animation-delay: -0.6s; }
        .song-item.active .num-txt { display: none; }
        .song-item.active .eq { display: flex; }
        body.is-paused .eq span { animation-play-state: paused; }

        /* ---------- REPRODUCTOR ---------- */
        /* Barra pegada abajo, de lado a lado (estilo Spotify) */
        .player {
            position: fixed; bottom: 0; left: 0; right: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 30px 16px;
            display: flex; flex-direction: column; gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            box-sizing: border-box;
            animation: playerIn 0.7s 0.2s var(--ease) both;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        body:not(.is-paused) .player { border-top-color: rgba(0,122,14,0.45); box-shadow: 0 -10px 30px rgba(0,0,0,0.5), 0 -4px 24px rgba(0,77,9,0.25); }

        .p-main-content { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .p-info { display: flex; align-items: center; width: 35%; min-width: 0; }
        .p-info img { width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.05); }
        .p-info img.pop { animation: pop 0.5s var(--ease); }
        .p-text { overflow: hidden; min-width: 0; }
        #p-tit { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
        #p-art { color: var(--texto-sec); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-text.pop { animation: fadeUp 0.4s var(--ease); }

        .p-controls { display: flex; align-items: center; gap: 15px; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; transition: color 0.2s, transform 0.2s var(--ease); display: flex; align-items: center; }
        .control-btn:hover { color: var(--primary-light); transform: scale(1.1); }
        .control-btn:active { transform: scale(0.92); }
        .control-btn.active { color: var(--primary-light); filter: drop-shadow(0 0 6px var(--primary-light)); }

        /* Botón de play minimalista: círculo liso, sin bordes ni sombras */
        .play-main {
            background: var(--play);
            color: #fff; width: 46px; height: 46px; border-radius: 50%;
            border: none; outline: none; box-shadow: none;
            display: flex !important;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.2s var(--ease), filter 0.2s ease;
        }
        .play-main:hover { color: #fff; transform: scale(1.06); filter: brightness(1.1); }
        .play-main:active { transform: scale(0.94); }

        .p-icon-play, .p-icon-pause { display: none; }
        /* Ajuste visual para que el triángulo del play se vea centrado al ojo */
        .p-icon-play { margin-left: 2px; }

        .playing .p-icon-pause { display: block; animation: pop 0.3s var(--ease); }
        .paused .p-icon-play { display: block; animation: pop 0.3s var(--ease); }

        /* Mientras el audio carga, el botón "respira" suavemente (sin agregar bordes) */
        @keyframes respirar { 50% { opacity: 0.55; } }
        .play-main.loading { animation: respirar 1s ease-in-out infinite; }

        .p-progress-container { display: flex; align-items: center; gap: 10px; width: 100%; }
        .time-display { font-size: 0.75rem; color: var(--texto-sec); width: 35px; text-align: center; font-variant-numeric: tabular-nums; }
        .p-progress-bar-wrapper { flex: 1; display: flex; align-items: center; position: relative; }

        input[type="range"]#p-progress-bar {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 0;
            background: linear-gradient(to right, var(--primary-light) var(--progress), rgba(255, 255, 255, 0.1) var(--progress));
            border-radius: 5px; outline: none; cursor: pointer;
            transition: height 0.2s ease;
        }
        .p-progress-bar-wrapper:hover input[type="range"]#p-progress-bar { height: 8px; }

        /* --- CIRCULITO PERSONALIZABLE --- */
        input[type="range"]#p-progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--thumb-url) no-repeat center center; /* USANDO VARIABLE */
            background-size: cover;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: transform 0.2s var(--ease), box-shadow 0.2s ease;
        }
        input[type="range"]#p-progress-bar:hover::-webkit-slider-thumb { transform: scale(1.12); box-shadow: 0 0 12px rgba(0,122,14,0.7); }
        input[type="range"]#p-progress-bar:active::-webkit-slider-thumb { transform: scale(0.95); }

        input[type="range"]#p-progress-bar::-moz-range-thumb {
            width: 28px; height: 28px;
            background: var(--thumb-url) no-repeat center center;
            background-size: cover;
            border-radius: 50%;
            border: 2px solid white;
            box-sizing: border-box;
            transition: transform 0.2s var(--ease);
        }
        input[type="range"]#p-progress-bar:hover::-moz-range-thumb { transform: scale(1.12); }

        /* ---------- PANEL DERECHO: info + letra ---------- */
        #panel-info {
            position: fixed; top: 0; right: 0; bottom: var(--player-h);
            width: var(--panel-w); box-sizing: border-box;
            background: rgba(18, 18, 18, 0.97);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 900;
            display: flex; flex-direction: column;
            transform: translateX(100%); visibility: hidden;
            transition: transform 0.45s var(--ease), visibility 0.45s;
        }
        body.panel-open #panel-info { transform: none; visibility: visible; }

        /* En pantallas grandes, el contenido se corre para dejarle lugar al panel */
        @media (min-width: 900px) {
            #main-view, .vista { transition: padding-right 0.45s var(--ease), right 0.45s var(--ease), opacity 0.35s ease, visibility 0.35s; }
            body.panel-open #main-view { padding-right: var(--panel-w); }
            body.panel-open .vista { right: var(--panel-w); }
        }

        .pi-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
        .pi-label { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--primary-light); letter-spacing: 0.5px; }
        .pi-cerrar { background: none; border: none; color: var(--texto-sec); cursor: pointer; padding: 4px; display: flex; border-radius: 50%; transition: color 0.2s, background 0.2s; }
        .pi-cerrar:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .pi-scroll { flex: 1; overflow-y: auto; padding: 10px 20px 30px; overscroll-behavior: contain; }
        .pi-scroll::-webkit-scrollbar { width: 6px; }
        .pi-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        .pi-contenido.pop { animation: fadeUp 0.45s var(--ease); }

        #pi-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: rgba(255,255,255,0.04); box-shadow: 0 14px 30px rgba(0,0,0,0.5); transition: opacity 0.4s ease; }
        #pi-tit { font-size: 1.5rem; font-weight: 800; margin: 18px 0 4px; line-height: 1.15; }
        .pi-art { color: var(--texto-sec); font-size: 0.95rem; }
        .pi-alb { color: var(--texto-sec); font-size: 0.85rem; margin-top: 6px; }
        .pi-alb-link { color: var(--texto); cursor: pointer; }
        .pi-alb-link:hover { text-decoration: underline; text-underline-offset: 2px; }

        .pi-sc {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
            background: #ff5500; color: #fff; text-decoration: none; font-weight: 700; font-size: 0.85rem;
            padding: 10px 18px; border-radius: 50px;
            transition: transform 0.2s var(--ease), filter 0.2s;
        }
        .pi-sc:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .pi-sc[hidden] { display: none; }

        .pi-letra-box { margin-top: 22px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 18px; }
        #pi-letra-tit { margin: 0 0 12px; font-size: 1rem; }
        #pi-letra { white-space: pre-wrap; line-height: 1.7; font-size: 0.95rem; color: #ddd; word-break: break-word; }
        #pi-letra.vacia { color: var(--texto-sec); font-style: italic; }

        .p-extra { width: 30%; display: flex; justify-content: flex-end; }

        audio { display: none; }
        /* Reproductor de SoundCloud: existe pero no se ve */
        #sc-frame { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }

        /* ---------- RESPONSIVE (celular) ---------- */
        @media (max-width: 640px) {
            header { padding: 36px 20px 14px; }
            h1 { font-size: 2.1rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 16px 20px; }
            .card { padding: 12px; }
            .card-play { width: 36px; height: 36px; opacity: 1; transform: none; }
            .vista { padding: 30px 20px 170px; }
            #art-img { width: 160px; height: 160px; }
            #art-nom { font-size: 2.2rem; }
            .alb-head { gap: 20px; }
            #alb-img { width: 180px; height: 180px; }
            #alb-tit { font-size: 2.2rem; }
            .player { padding: 12px 18px 14px; }
            .p-info { width: auto; flex: 1; }
            .p-extra { width: auto; margin-left: 12px; }
            #panel-info { width: 100%; }
        }

        /* Respeta a quien tiene las animaciones desactivadas en el sistema */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body class="is-paused">

    <div id="bg-album-blur"></div>

    <div id="main-view">
        <header>
            <div class="header-title">
                <h1>Bondiolas Music</h1>
                <span class="subtitle">Bienvenido a la biblioteca de Bondiolas</span>
            </div>
        </header>
        <div class="grid" id="grid-albumes"></div>
    </div>

    <div id="vista-artista" class="vista" aria-hidden="true">
        <button class="btn-back" onclick="cerrarArtista()">← Volver</button>
        <div class="alb-head">
            <img id="art-img" class="fade-img" alt="">
            <div>
                <span class="alb-label">Artista</span>
                <h2 id="art-nom"></h2>
                <p id="art-stats"></p>
            </div>
        </div>
        <h3 class="sec-tit">Álbumes</h3>
        <div class="grid" id="art-albumes"></div>
    </div>

    <div id="vista-album" class="vista" aria-hidden="true">
        <button class="btn-back" onclick="cerrarAlbum()">← Volver</button>
        <div class="alb-head">
            <img id="alb-img" class="fade-img" alt="">
            <div>
                <span class="alb-label">Álbum</span>
                <h2 id="alb-tit"></h2>
                <p id="alb-art"></p>
            </div>
        </div>
        <div id="lista-canciones"></div>
    </div>

    <aside id="panel-info" aria-hidden="true">
        <div class="pi-top">
            <span class="pi-label">Sonando ahora</span>
            <button class="pi-cerrar" onclick="cerrarPanel()" title="Cerrar">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
            </button>
        </div>
        <div class="pi-scroll">
            <div class="pi-contenido" id="pi-contenido">
                <img id="pi-img" class="fade-img" alt="">
                <h3 id="pi-tit"></h3>
                <div id="pi-art" class="pi-art"></div>
                <div class="pi-alb">Álbum · <span id="pi-alb" class="pi-alb-link"></span></div>
                <a id="pi-sc" class="pi-sc" target="_blank" rel="noopener" hidden>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Escuchar en SoundCloud
                </a>
                <div class="pi-letra-box">
                    <h4 id="pi-letra-tit">Letra</h4>
                    <div id="pi-letra"></div>
                </div>
            </div>
        </div>
    </aside>

    <div class="player">
        <div class="p-main-content">
            <div class="p-info">
                <img id="p-img" alt="">
                <div class="p-text" id="p-text">
                    <div id="p-tit">Selecciona una canción</div>
                    <div id="p-art">Bondiolas Music</div>
                </div>
            </div>

            <div class="p-controls">
                <button class="control-btn" id="btn-loop" onclick="toggleLoop()" title="Repetir">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
                <button class="control-btn play-main paused" id="btn-play" onclick="togglePlay()" title="Reproducir / Pausar">
                    <svg class="p-icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="p-icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
            <div class="p-extra">
                <button class="control-btn" id="btn-panel" onclick="togglePanel()" title="Letra e info">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 5h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-8h4v2h-2v8.5a2.5 2.5 0 1 1-2-2.45z"/></svg>
                </button>
            </div>
        </div>

        <div class="p-progress-container">
            <span id="current-time" class="time-display">0:00</span>
            <div class="p-progress-bar-wrapper">
                <input type="range" id="p-progress-bar" min="0" max="0" step="0.01" value="0">
            </div>
            <span id="total-duration" class="time-display">0:00</span>
        </div>
        <audio id="main-audio" preload="metadata"></audio>
    </div>

    <script>
        const URL_ALB = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSeiWFIXNf9Xvg2kBMH9VUoQzZzpAAVmcXg2T6PtO-gip5nj0sx2QlTF2LKNHerqqvM2TJZnjLfeGz/pub?gid=0&single=true&output=tsv";
        const URL_CAN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSeiWFIXNf9Xvg2kBMH9VUoQzZzpAAVmcXg2T6PtO-gip5nj0sx2QlTF2LKNHerqqvM2TJZnjLfeGz/pub?gid=92592278&single=true&output=tsv";

        // NOTA: los enlaces usan output=tsv. Si alguna vez las letras de varias líneas se ven cortadas, cambiar a output=csv.
        // --- AQUÍ PEGA EL ENLACE DE LA PESTAÑA "CONFIG" ---
        const URL_CFG = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSeiWFIXNf9Xvg2kBMH9VUoQzZzpAAVmcXg2T6PtO-gip5nj0sx2QlTF2LKNHerqqvM2TJZnjLfeGz/pub?gid=1912040231&single=true&output=tsv";

        // Imagen de reemplazo (antes usaba via.placeholder.com, que ya no funciona)
        const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1a1a1a"/>' +
            '<path d="M42 30v32a9 9 0 1 0 5 8V42h18V30z" fill="#007a0e"/></svg>'
        );

        let albumes = [], canciones = [];
        let albumActual = null;      // { alb, cans } del álbum abierto
        let urlSonando = '';         // para marcar la canción activa
        let colUrl = 2;      // columna del link de la canción (se detecta sola al cargar)
        const urlDe = c => (c && c[colUrl] ? c[colUrl] : '').trim();   // link de la canción (vacío = no disponible)
        const esActiva = c => { const u = urlDe(c); return !!u && u === urlSonando; };
        let arrastrando = false;     // true mientras el usuario mueve la barra
        let rafId = 0;

        // Cacheamos los elementos una sola vez (más rápido que buscarlos cada vez)
        const $ = id => document.getElementById(id);
        const audio = $('main-audio');
        const progressBar = $('p-progress-bar');
        const btnPlay = $('btn-play');
        const grid = $('grid-albumes');
        const vista = $('vista-album');
        const vistaArt = $('vista-artista');
        const lista = $('lista-canciones');
        const bg = $('bg-album-blur');
        const pImg = $('p-img');
        const tActual = $('current-time');
        const tTotal = $('total-duration');

        // Escapa texto para meterlo en HTML sin romper nada (comillas, <, &...)
        const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));

        function limpiar(url, esAudio = false) {
            if (!url) return "";
            url = url.trim();
            if (url.includes('github') || url.includes('raw')) return url;
            const match = url.match(/(?:id=|\/d\/)([\w-]+)/);
            const id = match ? match[1] : url;
            return esAudio ? `https://docs.google.com/uc?export=media&id=${id}` : `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
        }

        // Cambia una imagen con fade-in, sin recargar si ya es la misma
        function setImg(el, src) {
            src = src || PLACEHOLDER;
            if (el.getAttribute('src') === src) return;
            el.classList.remove('loaded');
            el.src = src;
        }

        // Un solo listener para todas las imágenes: fade-in al cargar y reemplazo si fallan
        document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('loaded'); }, true);
        document.addEventListener('error', e => {
            const img = e.target;
            if (img.tagName === 'IMG' && img.getAttribute('src') !== PLACEHOLDER) img.src = PLACEHOLDER;
        }, true);

        // ---------- ARTISTAS ----------
        // "Taksugo, Juanjokes" -> ["Taksugo", "Juanjokes"]
        const partirArtistas = str => String(str || '').split(',').map(x => x.trim()).filter(Boolean);
        const normArt = n => n.trim().toLowerCase();
        let artistas = new Map();   // nombre normalizado -> { nombre, albumes: [] }

        function indexarArtistas() {
            artistas = new Map();
            albumes.forEach(a => partirArtistas(a[2]).forEach(n => {
                const k = normArt(n);
                if (!artistas.has(k)) artistas.set(k, { nombre: n, albumes: [] });
                const ar = artistas.get(k);
                if (!ar.albumes.includes(a)) ar.albumes.push(a);
            }));
        }

        // Devuelve los nombres como links clickeables, separados por coma
        const artistasHTML = str => partirArtistas(str)
            .map(n => `<span class="art-link" data-art="${esc(n)}" role="link" tabindex="0">${esc(n)}</span>`)
            .join(', ');

        const tarjetaHTML = (a, i) => `
                    <div class="card" tabindex="0" data-id="${esc(a[0].trim())}" style="--i:${Math.min(i, 16)}">
                        <div class="card-cover">
                            <img class="fade-img" src="${esc(limpiar(a[3]) || PLACEHOLDER)}" alt="" loading="lazy" decoding="async">
                            <div class="card-play"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
                        </div>
                        <div class="card-tit">${esc(a[1])}</div>
                        <div class="card-art">${artistasHTML(a[2])}</div>
                    </div>`;

        // Lee CSV/TSV respetando celdas entre comillas (letras con saltos de línea, comas, etc.)
        function parsearTabla(txt, sep) {
            // TSV de Google: se lee tal cual (igual que la versión original), sin interpretar comillas
            if (sep === '\t') return txt.split(/\r?\n/).map(l => l.split('\t'));
            const filas = []; let fila = [], campo = '', comillas = false;
            for (let i = 0; i < txt.length; i++) {
                const ch = txt[i];
                if (comillas) {
                    if (ch === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else comillas = false; }
                    else campo += ch;
                } else if (ch === '"' && campo === '') comillas = true;
                else if (ch === sep) { fila.push(campo); campo = ''; }
                else if (ch === '\n' || ch === '\r') {
                    if (ch === '\r' && txt[i + 1] === '\n') i++;
                    fila.push(campo); filas.push(fila); fila = []; campo = '';
                } else campo += ch;
            }
            if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }
            return filas;
        }
        // Devuelve { cab: encabezados, filas: datos sin la fila de títulos }
        function leerTabla(txt, url) {
            const f = parsearTabla(txt, /output=tsv/.test(url) ? '\t' : ',');
            return { cab: f[0] || [], filas: f.slice(1).filter(r => r.some(c => c.trim())) };
        }
        const normTxt = t => String(t || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f'"‘’“”]/g, '');
        let colLetra = -1;   // columna "Letra" de la hoja Canciones (se busca por nombre)

        // Busca en qué columna están los links de las canciones:
        // 1) por el nombre del encabezado, 2) si no, la columna con más links, 3) si no, la 3ra (como antes)
        const pareceLink = v => /^https?:\/\//i.test(String(v || '').trim());
        function detectarColUrl(cab, filas) {
            const nombres = ['url', 'link', 'links', 'enlace', 'audio', 'soundcloud', 'archivo', 'mp3'];
            const porNombre = cab.findIndex((h, j) => j > 1 && j !== colLetra && nombres.includes(normTxt(h)));
            if (porNombre !== -1) return porNombre;
            let mejor = -1, max = 0;
            const ancho = Math.max(cab.length, ...filas.map(f => f.length));
            for (let j = 2; j < ancho; j++) {
                if (j === colLetra) continue;
                const n = filas.filter(f => pareceLink(f[j])).length;
                if (n > max) { max = n; mejor = j; }
            }
            return mejor !== -1 ? mejor : 2;
        }

        function mostrarSkeletons(n = 8) {
            grid.innerHTML = Array.from({ length: n }, (_, i) =>
                `<div class="card skeleton" style="--i:${i}"><div class="sk sk-img"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>`
            ).join('');
        }

        async function init() {
            setImg(pImg, PLACEHOLDER);
            mostrarSkeletons();
            try {
                const [resA, resC, resConfig] = await Promise.all([
                    fetch(URL_ALB),
                    fetch(URL_CAN),
                    URL_CFG.startsWith('http') ? fetch(URL_CFG).catch(() => null) : Promise.resolve(null)
                ]);

                albumes = leerTabla(await resA.text(), URL_ALB).filas;
                const tCan = leerTabla(await resC.text(), URL_CAN);
                canciones = tCan.filas;
                colLetra = tCan.cab.findIndex(h => normTxt(h) === 'letra');
                colUrl = detectarColUrl(tCan.cab, canciones);
                indexarArtistas();

                // Cargar imagen del circulito desde Excel
                if (resConfig && resConfig.ok) {
                    const configData = leerTabla(await resConfig.text(), URL_CFG).filas;
                    if (configData[0] && configData[0][0]) {
                        const thumbUrlFinal = limpiar(configData[0][0]);
                        document.documentElement.style.setProperty('--thumb-url', `url('${thumbUrlFinal}')`);
                    }
                }

                // Si hay canciones de SoundCloud, se deja su reproductor listo de antemano (primer play más rápido)
                const primeraSC = canciones.find(c => esSoundCloud(urlDe(c)));
                if (primeraSC) prepararSC(urlDe(primeraSC)).catch(() => {});

                // Ayuda para revisar el Sheets: muestra en la consola (F12) qué canciones quedaron sin link
                const sinLink = canciones.filter(c => !urlDe(c)).map(c => `${c[0]} - ${c[1]}`);
                console.info(`[Bondiolas] Columna de links: ${colUrl + 1} (${tCan.cab[colUrl] || 'sin título'}) · Columna de letra: ${colLetra + 1 || 'no encontrada'} · Canciones sin link: ${sinLink.length}`, sinLink);

                if (!albumes.length) { grid.innerHTML = '<div class="estado-msg">Todavía no hay álbumes cargados.</div>'; return; }

                // Se arma todo el HTML de una y se inserta una sola vez (mucho más rápido que innerHTML += en un bucle)
                grid.innerHTML = albumes.map(tarjetaHTML).join('');
            } catch (e) {
                console.error("Error cargando datos", e);
                grid.innerHTML = '<div class="estado-msg">No se pudo cargar la biblioteca. Revisá tu conexión y recargá la página.</div>';
            }
        }

        // Click en nombres de artista (va primero y frena el click de la tarjeta / canción)
        const abrirArtistaDesde = e => {
            const link = e.target.closest('.art-link');
            if (!link) return false;
            e.stopPropagation();
            e.preventDefault();
            verArtista(link.dataset.art);
            return true;
        };
        document.addEventListener('click', abrirArtistaDesde, true);
        document.addEventListener('keydown', e => { if (e.key === 'Enter') abrirArtistaDesde(e); }, true);

        // Click en tarjetas de álbum (inicio y perfiles; un solo listener para todas)
        document.addEventListener('click', e => {
            const card = e.target.closest('.card[data-id]');
            if (card) verAlbum(card.dataset.id);
        });
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const card = e.target.closest('.card[data-id]');
            if (card) verAlbum(card.dataset.id);
        });

        // Fondo difuminado con transición suave (precarga la imagen antes de cambiarla)
        let bgActual = '';
        function cambiarFondo(src) {
            if (!src || src === bgActual) return;
            bgActual = src;
            const pre = new Image();
            pre.onload = () => {
                if (bgActual !== src) return;
                bg.classList.add('fading');
                setTimeout(() => {
                    if (bgActual !== src) return;
                    bg.style.backgroundImage = `url("${src}")`;
                    bg.classList.remove('fading');
                }, 450);
            };
            pre.src = src;
        }

        function reanimar(el, clase) {
            el.classList.remove(clase);
            void el.offsetWidth; // fuerza a que la animación se repita
            el.classList.add(clase);
        }

        // =====================================================================
        //  MOTOR DE REPRODUCCIÓN: audio normal (Drive / GitHub) o SoundCloud
        // =====================================================================
        const esSoundCloud = url => /soundcloud\.com|snd\.sc/i.test(url || '');

        let modo = 'audio';          // 'audio' o 'sc'
        let repetir = false;

        // --- SoundCloud (reproductor oficial invisible, controlado por JS) ---
        let sc = null, scListo = null, scApi = null, scToken = 0;
        let scSonando = false, scPos = 0, scT = 0, scDur = 0;

        function cargarSCApi() {
            return scApi ||= new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = 'https://w.soundcloud.com/player/api.js';
                s.onload = res;
                s.onerror = () => { scApi = null; rej(new Error('No cargó la API de SoundCloud')); };
                document.head.appendChild(s);
            });
        }

        const SC_OPCIONES = 'auto_play=false&visual=false&show_artwork=false&show_comments=false&show_user=false&buying=false&sharing=false&download=false&show_teaser=false';

        function leerDuracionSC() {
            sc.getDuration(ms => {
                if (!ms) return;
                scDur = ms / 1000;
                progressBar.max = scDur;
                tTotal.innerText = formatTime(scDur);
                ultimoSeg = -1;
            });
        }

        function prepararSC(urlInicial) {
            if (scListo) return scListo;
            scListo = cargarSCApi().then(() => new Promise(res => {
                const f = document.createElement('iframe');
                f.id = 'sc-frame';
                f.title = 'SoundCloud';
                f.allow = 'autoplay; encrypted-media';
                f.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(urlInicial)}&${SC_OPCIONES}`;
                document.body.appendChild(f);

                sc = SC.Widget(f);
                const E = SC.Widget.Events;
                sc.bind(E.READY, () => res());
                sc.bind(E.PLAY, () => {
                    if (modo !== 'sc') { sc.pause(); return; }
                    scSonando = true; scT = performance.now();
                    btnPlay.classList.remove('loading');
                    if (!scDur) leerDuracionSC();
                    setEstado(true);
                });
                sc.bind(E.PAUSE, () => {
                    if (modo !== 'sc') return;
                    scSonando = false;
                    setEstado(false);
                });
                sc.bind(E.FINISH, () => {
                    if (modo !== 'sc') return;
                    if (repetir) { scPos = 0; scT = performance.now(); sc.seekTo(0); sc.play(); }
                    else { scSonando = false; scPos = scDur; setEstado(false); pintarProgreso(scDur); }
                });
                sc.bind(E.PLAY_PROGRESS, e => {
                    if (modo !== 'sc') return;
                    scPos = e.currentPosition / 1000;
                    scT = performance.now();
                });
                sc.bind(E.ERROR, () => {
                    btnPlay.classList.remove('loading');
                    console.error('SoundCloud no pudo reproducir esta canción (¿es privada o tiene bloqueado el embed?)');
                });
            }));
            scListo.catch(e => { console.error(e); scListo = null; });
            return scListo;
        }

        async function reproducirSC(url) {
            const token = ++scToken;
            btnPlay.classList.add('loading');
            scSonando = false; scPos = 0; scDur = 0;
            try { await prepararSC(url); } catch { btnPlay.classList.remove('loading'); return; }
            if (token !== scToken || modo !== 'sc') return;
            sc.load(url, {
                auto_play: true, visual: false, show_artwork: false, show_comments: false, show_user: false,
                callback: () => {
                    if (token !== scToken || modo !== 'sc') return;
                    leerDuracionSC();
                    sc.play();
                    // Si la canción no tiene letra en el Sheets, se usa la descripción de SoundCloud
                    if (!letraActual) sc.getCurrentSound(snd => {
                        if (token !== scToken || letraActual) return;
                        mostrarDescripcionSC(snd && snd.description);
                    });
                }
            });
        }

        // --- Interfaz común: el resto del código no necesita saber de dónde viene el audio ---
        const motor = {
            get pausado()  { return modo === 'sc' ? !scSonando : audio.paused; },
            get duracion() { return modo === 'sc' ? scDur : audio.duration; },
            get tiempo() {
                if (modo !== 'sc') return audio.currentTime;
                const t = scSonando ? scPos + (performance.now() - scT) / 1000 : scPos; // interpolado para que la barra vaya fluida
                return scDur ? Math.min(t, scDur) : t;
            },
            play()  { if (modo === 'sc') { sc && sc.play(); } else audio.play().catch(() => {}); },
            pause() { if (modo === 'sc') { sc && sc.pause(); } else audio.pause(); },
            seek(t) {
                if (modo === 'sc') { if (!sc) return; sc.seekTo(t * 1000); scPos = t; scT = performance.now(); }
                else audio.currentTime = t;
            }
        };

        function cambiarModo(nuevo) {
            if (modo === 'sc') { scToken++; sc && sc.pause(); scSonando = false; }
            else { audio.pause(); }
            modo = nuevo;
        }

        function resetProgreso() {
            progressBar.max = 0;
            progressBar.value = 0;
            progressBar.style.setProperty('--progress', '0%');
            tActual.innerText = '0:00';
            tTotal.innerText = '0:00';
            ultimoSeg = -1;
        }

        // ---------- PANEL DERECHO ----------
        const panel = $('panel-info');
        let letraActual = '';

        function abrirPanel()  { document.body.classList.add('panel-open'); panel.setAttribute('aria-hidden', 'false'); $('btn-panel').classList.add('active'); }
        function cerrarPanel() { document.body.classList.remove('panel-open'); panel.setAttribute('aria-hidden', 'true'); $('btn-panel').classList.remove('active'); }
        function togglePanel() { if (!urlSonando) return; document.body.classList.contains('panel-open') ? cerrarPanel() : abrirPanel(); }

        function ponerLetra(titulo, texto, vacioMsg) {
            const el = $('pi-letra');
            const limpio = String(texto || '').replace(/\r\n?/g, '\n').trim();
            $('pi-letra-tit').innerText = titulo;
            el.textContent = limpio || vacioMsg;
            el.classList.toggle('vacia', !limpio);
        }
        function mostrarDescripcionSC(desc) {
            ponerLetra('Descripción', desc, 'Esta canción todavía no tiene letra ni descripción.');
        }

        function mostrarInfo(t, art, url, imgF, alb, letra) {
            setImg($('pi-img'), imgF);
            $('pi-tit').innerText = t;
            $('pi-art').innerHTML = artistasHTML(art);
            const albEl = $('pi-alb');
            albEl.innerText = alb ? alb[1] : '—';
            albEl.dataset.id = alb ? alb[0].trim() : '';

            const scBtn = $('pi-sc');
            if (esSoundCloud(url)) { scBtn.href = url; scBtn.hidden = false; }
            else { scBtn.removeAttribute('href'); scBtn.hidden = true; }

            letraActual = String(letra || '').trim();
            if (letraActual) ponerLetra('Letra', letraActual);
            else if (esSoundCloud(url)) ponerLetra('Descripción', '', 'Cargando descripción de SoundCloud…');
            else ponerLetra('Letra', '', 'Esta canción todavía no tiene letra.');

            panel.querySelector('.pi-scroll').scrollTop = 0;
            reanimar($('pi-contenido'), 'pop');
            abrirPanel();
        }

        $('pi-alb').addEventListener('click', e => { const id = e.currentTarget.dataset.id; if (id) verAlbum(id); });

        // El panel termina justo arriba del reproductor, aunque cambie su alto
        if ('ResizeObserver' in window) {
            const playerEl = document.querySelector('.player');
            new ResizeObserver(() => document.documentElement.style.setProperty('--player-h', playerEl.offsetHeight + 'px')).observe(playerEl);
        }

        function sonar(t, art, url, img, alb = null, letra = '') {
            $('p-tit').innerText = t;
            $('p-art').innerHTML = artistasHTML(art);
            reanimar($('p-text'), 'pop');
            const imgF = limpiar(img);
            setImg(pImg, imgF);
            reanimar(pImg, 'pop');
            cambiarFondo(imgF);

            url = (url || '').trim();
            const misma = url === urlSonando;
            urlSonando = url;
            marcarActiva();
            if (misma) abrirPanel();
            else mostrarInfo(t, art, url, imgF, alb, letra);

            if (misma) {
                motor.seek(0);
                motor.play();
            } else if (esSoundCloud(url)) {
                cambiarModo('sc');
                resetProgreso();
                audio.removeAttribute('src');
                audio.load();
                reproducirSC(url);
            } else {
                cambiarModo('audio');
                resetProgreso();
                audio.src = limpiar(url, true);
                audio.play().catch(() => {});
            }

            // Controles del celular / pantalla de bloqueo
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: t, artist: art, album: albumActual ? albumActual.alb[1] : 'Bondiolas Music',
                    artwork: imgF ? [{ src: imgF, sizes: '512x512' }] : []
                });
            }
        }

        function togglePlay() {
            if (!urlSonando) return;
            if (motor.pausado) motor.play();
            else motor.pause();
        }

        function toggleLoop() {
            repetir = !repetir;
            audio.loop = repetir;
            $('btn-loop').classList.toggle('active', repetir);
        }

        // El estado del botón sigue al audio real (no se desincroniza nunca)
        function setEstado(sonando) {
            btnPlay.classList.toggle('playing', sonando);
            btnPlay.classList.toggle('paused', !sonando);
            document.body.classList.toggle('is-paused', !sonando);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = sonando ? 'playing' : 'paused';
            cancelAnimationFrame(rafId);
            if (sonando) rafId = requestAnimationFrame(loopProgreso);
        }

        // Eventos del <audio> normal (se ignoran mientras suena SoundCloud)
        const enAudio = (ev, fn) => audio.addEventListener(ev, e => { if (modo === 'audio') fn(e); });
        enAudio('play', () => setEstado(true));
        enAudio('pause', () => setEstado(false));
        enAudio('ended', () => setEstado(false));
        enAudio('waiting', () => btnPlay.classList.add('loading'));
        enAudio('loadstart', () => btnPlay.classList.add('loading'));
        ['playing', 'canplay', 'pause', 'error'].forEach(ev => enAudio(ev, () => btnPlay.classList.remove('loading')));

        // Barra de progreso fluida a 60fps
        let ultimoSeg = -1;
        function pintarProgreso(t) {
            const d = motor.duracion;
            if (!d || isNaN(d)) return;
            progressBar.value = t;
            progressBar.style.setProperty('--progress', (t / d) * 100 + '%');
            const s = Math.floor(t);
            if (s !== ultimoSeg) { ultimoSeg = s; tActual.innerText = formatTime(t); }
        }
        function loopProgreso() {
            if (!arrastrando) pintarProgreso(motor.tiempo);
            if (!motor.pausado) rafId = requestAnimationFrame(loopProgreso);
        }
        enAudio('timeupdate', () => { if (audio.paused && !arrastrando) pintarProgreso(audio.currentTime); });
        enAudio('loadedmetadata', () => { progressBar.max = audio.duration; tTotal.innerText = formatTime(audio.duration); ultimoSeg = -1; });

        // Mientras arrastrás solo se mueve la barra; el salto real se hace al soltar
        progressBar.addEventListener('input', () => {
            arrastrando = true;
            const d = motor.duracion || 0;
            const v = +progressBar.value;
            progressBar.style.setProperty('--progress', d ? (v / d) * 100 + '%' : '0%');
            tActual.innerText = formatTime(v);
        });
        progressBar.addEventListener('change', () => {
            const v = +progressBar.value;
            if (motor.duracion) motor.seek(v);
            arrastrando = false;
            if (motor.pausado) { ultimoSeg = -1; pintarProgreso(v); }
        });

        function formatTime(s) { if (!isFinite(s)) return '0:00'; const m = Math.floor(s/60); const ss = Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; }

        window.addEventListener('keydown', (e) => {
            if (e.code === "Space" && !e.repeat) { e.preventDefault(); togglePlay(); }
            if (e.key === "Escape") {
                if (vista.classList.contains('open')) cerrarAlbum();
                else if (vistaArt.classList.contains('open')) cerrarArtista();
                else if (document.body.classList.contains('panel-open')) cerrarPanel();
            }
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => motor.play());
            navigator.mediaSession.setActionHandler('pause', () => motor.pause());
            try { navigator.mediaSession.setActionHandler('seekto', d => motor.seek(d.seekTime)); } catch (_) {}
        }

        function marcarActiva() {
            lista.querySelectorAll('.song-item').forEach(el => {
                el.classList.toggle('active', !!albumActual && esActiva(albumActual.cans[+el.dataset.i]));
            });
        }

        function verAlbum(id) {
            const alb = albumes.find(a => a[0].trim() == id.trim());
            if (!alb) return;
            const cans = canciones.filter(c => c[0].trim() == id.trim());
            albumActual = { alb, cans };

            setImg($('alb-img'), limpiar(alb[3]));
            $('alb-tit').innerText = alb[1];
            $('alb-art').innerHTML = artistasHTML(alb[2]);

            lista.innerHTML = cans.length
                ? cans.map((c, i) => `
                    <div class="song-item${esActiva(c) ? ' active' : ''}${urlDe(c) ? '' : ' no-disp'}" data-i="${i}" style="--i:${Math.min(i, 20)}"${urlDe(c) ? '' : ' title="No disponible para escuchar"'}>
                        <div class="song-num"><span class="num-txt">${i+1}</span><span class="eq"><span></span><span></span><span></span></span></div>
                        <div style="flex:1; min-width:0;"><b>${esc(c[1])}</b><br><small>${artistasHTML(alb[2])}</small></div>
                        ${urlDe(c) ? '' : '<svg class="icon-no-disp" viewBox="0 0 24 24" width="20" height="20" aria-label="No disponible"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5.6 5.6l12.8 12.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'}
                    </div>`).join('')
                : '<div class="estado-msg">Este álbum todavía no tiene canciones.</div>';

            vista.scrollTop = 0;
            vista.classList.add('open');
            vista.setAttribute('aria-hidden', 'false');
            actualizarScroll();
        }

        lista.addEventListener('click', e => {
            const item = e.target.closest('.song-item');
            if (!item || !albumActual) return;
            const c = albumActual.cans[+item.dataset.i];
            const { alb } = albumActual;
            if (!urlDe(c)) { reanimar(item, 'shake'); return; }      // sin link: no se puede escuchar
            if (esActiva(c)) { togglePlay(); return; }                 // tocar la que ya suena = pausa/play
            sonar(c[1], alb[2], urlDe(c), alb[3], alb, colLetra >= 0 ? c[colLetra] : '');
        });

        function actualizarScroll() {
            const hayVista = vista.classList.contains('open') || vistaArt.classList.contains('open');
            document.body.classList.toggle('no-scroll', hayVista);
        }

        function cerrarAlbum() {
            vista.classList.remove('open');
            vista.setAttribute('aria-hidden', 'true');
            actualizarScroll();   // si venías de un perfil, volvés a él
        }

        // ---------- PERFIL DE ARTISTA ----------
        function verArtista(nombre) {
            const ar = artistas.get(normArt(nombre || ''));
            if (!ar) return;
            if (vista.classList.contains('open')) cerrarAlbum();   // el perfil queda debajo del álbum, así que se cierra el álbum

            const ids = new Set(ar.albumes.map(a => a[0].trim()));
            const nCanciones = canciones.filter(c => ids.has(c[0].trim())).length;
            const nAlb = ar.albumes.length;

            setImg($('art-img'), limpiar(ar.albumes[0][3]));
            $('art-nom').innerText = ar.nombre;
            $('art-stats').innerText = `${nAlb} ${nAlb === 1 ? 'álbum' : 'álbumes'} · ${nCanciones} ${nCanciones === 1 ? 'canción' : 'canciones'}`;
            $('art-albumes').innerHTML = ar.albumes.map(tarjetaHTML).join('');

            vistaArt.scrollTop = 0;
            vistaArt.classList.add('open');
            vistaArt.setAttribute('aria-hidden', 'false');
            actualizarScroll();
        }

        function cerrarArtista() {
            vistaArt.classList.remove('open');
            vistaArt.setAttribute('aria-hidden', 'true');
            actualizarScroll();
        }

        init();
    </script>
</body>
</html>
